# Cortex console plugin deployment.
#
# Creates:
#   - Namespace cortex-plugin
#   - Deployment serving the static plugin bundle via nginx
#   - Service pointing at the deployment
#   - ConsolePlugin CR registering the plugin with the console operator
#
# After applying, enable the plugin (see README.md step 4).

---
apiVersion: v1
kind: Namespace
metadata:
  name: cortex-plugin

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cortex-plugin
  namespace: cortex-plugin
  labels:
    app: cortex-plugin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cortex-plugin
  template:
    metadata:
      labels:
        app: cortex-plugin
    spec:
      containers:
        - name: nginx
          # Replace with the image reference you pushed (README step 3).
          image: icr.io/vopo/cortex-plugin:0.1
          imagePullPolicy: Always
          ports:
            - containerPort: 8443
          volumeMounts:
            - name: plugin-tls
              mountPath: /etc/nginx/certs
              readOnly: true
          readinessProbe:
            httpGet:
              path: /plugin-manifest.json
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 5
      volumes:
        - name: plugin-tls
          secret:
            # Populated by the service-ca operator via the Service annotation
            secretName: cortex-plugin-tls

---
apiVersion: v1
kind: Service
metadata:
  name: cortex-plugin
  namespace: cortex-plugin
  labels:
    app: cortex-plugin
  annotations:
    # Tells the service-ca operator to generate a TLS cert for this service
    # and store it in the cortex-plugin-tls Secret.
    service.beta.openshift.io/serving-cert-secret-name: cortex-plugin-tls
spec:
  selector:
    app: cortex-plugin
  ports:
    - port: 8443
      targetPort: 8443

---
apiVersion: console.openshift.io/v1
kind: ConsolePlugin
metadata:
  name: cortex
spec:
  displayName: 'Cortex'
  backend:
    type: Service
    service:
      name: cortex-plugin
      namespace: cortex-plugin
      port: 8443
      basePath: '/'
