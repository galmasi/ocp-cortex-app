# Cortex standalone app deployment.
#
# Creates (namespace cortex):
#   - ConfigMap cortex-nginx-template (nginx.conf.template — kept out of
#     the image so config changes deploy without an image rebuild;
#     cortex-app-image/nginx.conf.template in the repo is the source of
#     truth for this block — keep them in sync)
#   - Deployment cortex  (nginx: SPA + OAuth exchange + API/WS proxy)
#   - Service cortex     (8080, plain HTTP)
#   - Role/RoleBinding router-cert-reader (lets the router SA read the
#     cortex-tls secret for the edge route's externalCertificate)
#   - Route cortex       (cortex.apps.<domain>, edge termination with the
#     cluster wildcard cert, http:80 -> https redirect)
#
# Prerequisites (NOT created here — cluster-admin / reconciler applies):
#   - Secret cortex-oauth: OAUTH_BASIC = base64("cortex:<secret>")
#     matching the OAuthClient's secret (manifests/oauthclient.yaml)
#   - Secret cortex-tls: copy of the router's wildcard cert — used by the
#     ROUTE (externalCertificate); TLS is terminated at the router and
#     the pod serves plain HTTP on 8080.
#
# Upstream note: pods on this cluster CANNOT reach service ClusterIPs
# (verified empirically, Oct 2026) — the API and WS proxies target the
# external apiserver endpoint api.<domain>:6443 instead, which is
# reachable in-cluster and presents a cert signed by the same CA.
---
apiVersion: v1
kind: Namespace
metadata:
  name: cortex
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cortex-nginx-template
  namespace: cortex
  labels:
    app: cortex
data:
  nginx.conf.template: |
    # nginx config for the Cortex standalone app. envsubst TEMPLATE —
    # the nginx-unprivileged entrypoint substitutes ${...} (OAUTH_BASIC,
    # from a Secret) at container start and writes the result to
    # /etc/nginx/nginx.conf (NGINX_ENVSUBST_OUTPUT_DIR). The client
    # secret must never appear in the repo or the JS bundle.
    #
    # Responsibilities:
    #   /                static SPA (try_files: /auth/callback deep-links)
    #   /auth/exchange   OAuth code-for-token exchange; adds the client
    #                    Basic-auth header and forwards to the OAuth
    #                    server's token endpoint
    #   /api, /apis      same-origin proxy to the apiserver with the
    #                    browser's Bearer token forwarded as-is
    #   /ws/             exec/attach WebSockets; browsers cannot set
    #                    Authorization headers on WebSocket, so the token
    #                    rides as ?access_token= and is moved into the
    #                    header here. The /ws prefix is stripped.
    #
    # TLS: terminated at the ROUTER (edge route, cluster wildcard cert via
    # externalCertificate; http:80 redirects to https there). This server
    # speaks plain HTTP to the router on 8080.
    #
    # (No "daemon off;" here: the base image's CMD already passes
    # -g "daemon off;" and a second occurrence is a fatal error.)

    worker_processes 1;
    error_log /dev/stderr info;
    pid /tmp/nginx.pid;

    events { worker_connections 1024; }

    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;

      # Session tokens ride in query strings on /ws — log URIs without args.
      log_format noquery '$remote_addr - $remote_user [$time_local] '
                          '"$request_method $uri" $status $body_bytes_sent';
      access_log /dev/stdout noquery;

      server {
        # TLS is terminated by the router (edge route with the cluster
        # wildcard cert via externalCertificate; http on :80 is redirected
        # to https there too) — this server speaks plain HTTP to the router.
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # --- static SPA; deep links (/auth/callback) fall back to index ---
        location / {
          try_files $uri $uri/ /index.html;
        }

        # --- OAuth code exchange: the only place the client secret lives ---
        location = /auth/exchange {
          proxy_pass https://oauth-openshift.apps.epoc000.ete14.res.ibm.com/oauth/token;
          proxy_set_header Authorization "Basic ${OAUTH_BASIC}";
          proxy_set_header Content-Type "application/x-www-form-urlencoded";
          proxy_ssl_server_name on;
        }

        # --- Kubernetes REST: forward the browser's Bearer token as-is ---
        location /api/ {
          proxy_pass https://api.epoc000.ete14.res.ibm.com:6443;
          proxy_set_header Authorization $http_authorization;
          proxy_ssl_trusted_certificate /var/run/secrets/kubernetes.io/serviceaccount/ca.crt;
          proxy_ssl_verify on;
          proxy_ssl_server_name on;
          proxy_ssl_name api.epoc000.ete14.res.ibm.com;
        }
        location /apis/ {
          proxy_pass https://api.epoc000.ete14.res.ibm.com:6443;
          proxy_set_header Authorization $http_authorization;
          proxy_ssl_trusted_certificate /var/run/secrets/kubernetes.io/serviceaccount/ca.crt;
          proxy_ssl_verify on;
          proxy_ssl_server_name on;
          proxy_ssl_name api.epoc000.ete14.res.ibm.com;
        }

        # --- Gateway admin (same-origin): SPA provision + heartbeat.
        # Reached via the cortex-gw edge route, not the service
        # ClusterIP (unreachable from pods on this cluster); the router
        # presents the Let's Encrypt wildcard, which is not in the
        # serviceaccount CA, so verification is off like the oauth
        # exchange upstream.
        location /__cortex/ {
          proxy_pass https://cortex-gw.apps.epoc000.ete14.res.ibm.com;
          proxy_set_header Authorization $http_authorization;
          proxy_ssl_server_name on;
          proxy_ssl_verify off;
        }

        # --- exec/attach WebSockets: token from ?access_token= ---
        location /ws/ {
          proxy_pass https://api.epoc000.ete14.res.ibm.com:6443/;
          proxy_set_header Authorization "Bearer $arg_access_token";
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
          proxy_http_version 1.1;
          proxy_ssl_trusted_certificate /var/run/secrets/kubernetes.io/serviceaccount/ca.crt;
          proxy_ssl_verify on;
          proxy_ssl_server_name on;
          proxy_ssl_name api.epoc000.ete14.res.ibm.com;
          proxy_read_timeout 3600s;
          proxy_send_timeout 3600s;
          # keep tokens out of the access log
          access_log /dev/stdout noquery;
        }
      }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cortex
  namespace: cortex
  labels:
    app: cortex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cortex
  template:
    metadata:
      labels:
        app: cortex
    spec:
      containers:
        - name: nginx
          image: ghcr.io/galmasi/cortex-app:0.12.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            # base64("cortex:<oauth client secret>") — from Secret
            # cortex-oauth; injected into nginx.conf via envsubst.
            - name: OAUTH_BASIC
              valueFrom:
                secretKeyRef:
                  name: cortex-oauth
                  key: OAUTH_BASIC
          volumeMounts:
            - name: nginx-template
              mountPath: /etc/nginx/templates
              readOnly: true
          readinessProbe:
            httpGet:
              path: /index.html
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 5
      volumes:
        - name: nginx-template
          configMap:
            name: cortex-nginx-template
---
apiVersion: v1
kind: Service
metadata:
  name: cortex
  namespace: cortex
  labels:
    app: cortex
spec:
  selector:
    app: cortex
  ports:
    - port: 8080
      targetPort: 8080
---
# The router terminates TLS with the cluster wildcard cert
# (externalCertificate) and redirects http:80 to https:443.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: cortex
  namespace: cortex
  labels:
    app: cortex
spec:
  host: cortex.apps.epoc000.ete14.res.ibm.com
  to:
    kind: Service
    name: cortex
    weight: 100
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
    externalCertificate:
      name: cortex-tls
---
# Lets the router service account read the cortex-tls secret for the
# edge route's externalCertificate (scoped to this one secret).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: router-cert-reader
  namespace: cortex
rules:
  - apiGroups: [""]
    verbs: [get, watch, list]
    resources: [secrets]
    resourceNames: [cortex-tls]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: router-cert-reader
  namespace: cortex
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: router-cert-reader
subjects:
  - kind: ServiceAccount
    name: router
    namespace: openshift-ingress
