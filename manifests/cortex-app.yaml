# Cortex standalone app deployment.
#
# Creates (namespace cortex-app):
#   - ConfigMap cortex-nginx-template (nginx.conf.template — kept out of
#     the image so config changes deploy without an image rebuild;
#     cortex-app-image/nginx.conf.template in the repo is the source of
#     truth for this block — keep them in sync)
#   - Deployment cortex-app  (nginx: SPA + OAuth exchange + API/WS proxy)
#   - Service cortex-app     (8443)
#   - Route cortex-app       (cortex-app.apps.<domain>, passthrough)
#
# Prerequisites (NOT created here — cluster-admin / reconciler applies):
#   - Secret cortex-tls: copy of the router's wildcard cert
#     (see scripts/reconcile.sh for the per-user copies; same procedure)
#   - Secret cortex-oauth: { OAUTH_BASIC: base64("cortex-app:<secret>") }
#     matching the OAuthClient's secret (manifests/oauthclient.yaml)
#
# Route host note: cortex.apps.<domain> is the OpenShift console itself
# on this cluster, so the app uses cortex-app.apps.<domain>.
#
# Upstream note: pods on this cluster CANNOT reach service ClusterIPs
# (verified empirically, Oct 2026) — the API and WS proxies target the
# external apiserver endpoint api.<domain>:6443 instead, which is
# reachable in-cluster and presents a cert signed by the same CA.
---
apiVersion: v1
kind: Namespace
metadata:
  name: cortex-app
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cortex-nginx-template
  namespace: cortex-app
  labels:
    app: cortex-app
data:
  nginx.conf.template: |
    # nginx config for the Cortex standalone app. envsubst TEMPLATE —
    # the nginx-unprivileged entrypoint substitutes ${...} (OAUTH_BASIC,
    # from a Secret) at container start and writes the result to
    # /etc/nginx/nginx.conf (NGINX_ENVSUBST_OUTPUT_DIR). The client
    # secret must never appear in the repo or the JS bundle.
    #
    # Responsibilities:
    #   /                static SPA (try_files: /auth/callback deep-links)
    #   /auth/exchange   OAuth code-for-token exchange; adds the client
    #                    Basic-auth header and forwards to the OAuth
    #                    server's token endpoint
    #   /api, /apis      same-origin proxy to the apiserver with the
    #                    browser's Bearer token forwarded as-is
    #   /ws/             exec/attach WebSockets; browsers cannot set
    #                    Authorization headers on WebSocket, so the token
    #                    rides as ?access_token= and is moved into the
    #                    header here. The /ws prefix is stripped.
    #
    # TLS: this pod presents the cluster wildcard certificate (secret
    # cortex-tls) behind a passthrough Route — same ingress pattern as
    # the per-user instances. Clients get the cluster's LE cert.
    #
    # (No "daemon off;" here: the base image's CMD already passes
    # -g "daemon off;" and a second occurrence is a fatal error.)
    
    worker_processes 1;
    error_log /dev/stderr info;
    pid /tmp/nginx.pid;
    
    events { worker_connections 1024; }
    
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
    
      # Session tokens ride in query strings on /ws — log URIs without args.
      log_format noquery '$remote_addr - $remote_user [$time_local] '
                          '"$request_method $uri" $status $body_bytes_sent';
      access_log /dev/stdout noquery;
    
      server {
        listen 8443 ssl;
        server_name _;
    
        ssl_certificate /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;
    
        root /usr/share/nginx/html;
        index index.html;
    
        # --- static SPA; deep links (/auth/callback) fall back to index ---
        location / {
          try_files $uri $uri/ /index.html;
        }
    
        # --- OAuth code exchange: the only place the client secret lives ---
        location = /auth/exchange {
          proxy_pass https://oauth-openshift.apps.epoc000.ete14.res.ibm.com/oauth/token;
          proxy_set_header Authorization "Basic ${OAUTH_BASIC}";
          proxy_set_header Content-Type "application/x-www-form-urlencoded";
          proxy_ssl_server_name on;
        }
    
        # --- Kubernetes REST: forward the browser's Bearer token as-is ---
        location /api/ {
          proxy_pass https://api.epoc000.ete14.res.ibm.com:6443;
          proxy_set_header Authorization $http_authorization;
          proxy_ssl_trusted_certificate /var/run/secrets/kubernetes.io/serviceaccount/ca.crt;
          proxy_ssl_verify on;
          proxy_ssl_server_name on;
          proxy_ssl_name api.epoc000.ete14.res.ibm.com;
        }
        location /apis/ {
          proxy_pass https://api.epoc000.ete14.res.ibm.com:6443;
          proxy_set_header Authorization $http_authorization;
          proxy_ssl_trusted_certificate /var/run/secrets/kubernetes.io/serviceaccount/ca.crt;
          proxy_ssl_verify on;
          proxy_ssl_server_name on;
          proxy_ssl_name api.epoc000.ete14.res.ibm.com;
        }
    
        # --- exec/attach WebSockets: token from ?access_token= ---
        location /ws/ {
          proxy_pass https://api.epoc000.ete14.res.ibm.com:6443/;
          proxy_set_header Authorization "Bearer $arg_access_token";
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
          proxy_http_version 1.1;
          proxy_ssl_trusted_certificate /var/run/secrets/kubernetes.io/serviceaccount/ca.crt;
          proxy_ssl_verify on;
          proxy_ssl_server_name on;
          proxy_ssl_name api.epoc000.ete14.res.ibm.com;
          proxy_read_timeout 3600s;
          proxy_send_timeout 3600s;
          # keep tokens out of the access log
          access_log /dev/stdout noquery;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cortex-app
  namespace: cortex-app
  labels:
    app: cortex-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cortex-app
  template:
    metadata:
      labels:
        app: cortex-app
    spec:
      containers:
        - name: nginx
          image: icr.io/vopo/cortex-app:0.1
          imagePullPolicy: Always
          ports:
            - containerPort: 8443
          env:
            # base64("cortex-app:<oauth client secret>") — from Secret
            # cortex-oauth; injected into nginx.conf via envsubst.
            - name: OAUTH_BASIC
              valueFrom:
                secretKeyRef:
                  name: cortex-oauth
                  key: OAUTH_BASIC
          volumeMounts:
            - name: app-tls
              mountPath: /etc/nginx/certs
              readOnly: true
            - name: nginx-template
              mountPath: /etc/nginx/templates
              readOnly: true
          readinessProbe:
            httpGet:
              path: /index.html
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 5
      volumes:
        - name: app-tls
          secret:
            secretName: cortex-tls
        - name: nginx-template
          configMap:
            name: cortex-nginx-template
---
apiVersion: v1
kind: Service
metadata:
  name: cortex-app
  namespace: cortex-app
  labels:
    app: cortex-app
spec:
  selector:
    app: cortex-app
  ports:
    - port: 8443
      targetPort: 8443
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: cortex-app
  namespace: cortex-app
  labels:
    app: cortex-app
spec:
  # Passthrough: this pod presents the cluster wildcard cert itself
  # (secret cortex-tls), so clients see the cluster's certificate.
  host: cortex-app.apps.epoc000.ete14.res.ibm.com
  to:
    kind: Service
    name: cortex-app
    weight: 100
  port:
    targetPort: 8443
  tls:
    termination: passthrough
