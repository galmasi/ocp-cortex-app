# RBAC for the Cortex reconciler ServiceAccount.
#
# The reconciler is the server-side component that watches registered
# users and pre-creates their cortex-<username> namespaces and RBAC.
# It needs cluster-scope grants; nothing else in the system does.

---
apiVersion: v1
kind: Namespace
metadata:
  name: cortex-system
  labels:
    app: cortex-reconciler

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cortex-reconciler
  namespace: cortex-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cortex-reconciler
  labels:
    app: cortex-reconciler
rules:
  # Discover registered users
  - apiGroups: ["user.openshift.io"]
    resources: ["users"]
    verbs: ["get", "list", "watch"]
  # Create per-user namespaces and the Role/RoleBinding inside them
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create"]
  # RoleBindings reference Roles/ClusterRoles; the namespaced Role grant
  # is delegated through the namespace creation.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update"]
  # Optional: label user namespaces for selection by the idle reaper
  - apiGroups: [""]
    resources: ["namespaces/finalize"]
    verbs: ["update"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cortex-reconciler
  labels:
    app: cortex-reconciler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cortex-reconciler
subjects:
  - kind: ServiceAccount
    name: cortex-reconciler
    namespace: cortex-system
