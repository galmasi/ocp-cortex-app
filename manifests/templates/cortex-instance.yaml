# Cortex per-user instance template.
#
# Produces, in namespace cortex-<USERNAME>:
#   - ConfigMap  cortex-config    (engine config: localhost forward proxy)
#   - ConfigMap  cortex-tls-front (nginx TLS-terminator config)
#   - Deployment cortex           (3 containers: /cortex engine, /agentop,
#                                  tls-front nginx sidecar)
#   - Service    cortex           (ClusterIP, TLS port 13000)
#   - Route      cortex           (cortex-<USERNAME>.apps.<domain>, passthrough)
#
# Prerequisite (created by the reconciler, NOT by this template — users
# cannot read the source secret):
#   - Secret cortex-tls: copy of the router's wildcard cert
#     (openshift-ingress/xaas-postinstall-cert-secret-certpolicy-aws-route53-prod,
#     CN *.epoc000.ete14.res.ibm.com, SANs *.apps.epoc000... — Let's
#     Encrypt signed, so clients need no custom CA).
#
# Usage:
#   oc process -f cortex-instance.yaml -p USERNAME=alice | oc apply -f -
#
# The plugin creates the same objects via the Kubernetes API on demand;
# this template is the reference manifest and the manual/testing path.
# Keep in sync with buildObjects() in src/CortexPage.tsx.
#
# Why the sidecar: the router routes HTTP by Host header, which in proxy
# requests names the TARGET, not the proxy — proxy traffic can only enter
# via SNI (passthrough), and whoever terminates TLS must hold the cluster
# wildcard key to present the cluster's cert.

---
apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: cortex-instance
  annotations:
    description: "Per-user Cortex instance (engine+agentop+tls-front pod, service, passthrough route)"
parameters:
  - name: USERNAME
    displayName: Sanitized username
    description: DNS-1123-safe username; the instance lives in cortex-${USERNAME}
    required: true
  - name: IMAGE
    displayName: Instance image
    description: Container image containing /cortex and /agentop
    value: icr.io/vopo/cortex:latest
  - name: TLS_FRONT_IMAGE
    displayName: TLS front image
    description: Image containing nginx, used to terminate TLS
    value: icr.io/vopo/cortex-plugin:0.1
  - name: FORWARD_PROXY_PORT
    displayName: Forward proxy port (TLS)
    description: Port the tls-front sidecar serves TLS on; the Route target
    value: "13000"
  - name: ENGINE_PORT
    displayName: Engine port
    description: listener.forward_proxy_addr port (localhost only, behind tls-front)
    value: "13001"
  - name: SESSION_API_PORT
    displayName: Session API port
    description: listener.session_api_addr port, agentop's --endpoint target
    value: "19095"
  - name: CLUSTER_APPS_DOMAIN
    displayName: Cluster apps domain
    description: Wildcard domain the default router serves
    value: apps.epoc000.ete14.res.ibm.com
objects:

# --- engine configuration ----------------------------------------------
- apiVersion: v1
  kind: ConfigMap
  metadata:
    name: cortex-config
    namespace: cortex-${USERNAME}
    labels:
      app: cortex
      cortex-user: ${USERNAME}
  data:
    cortex.yaml: |
      listener:
        forward_proxy_addr: "127.0.0.1:${ENGINE_PORT}"
        transparent_proxy_addr: ":18082"
        reverse_proxy_backend: "http://127.0.0.1:1"
        session_api_addr: ":${SESSION_API_PORT}"

      tls_bridge:
        mode: disabled

      pipeline:
        outbound:
          plugins:
            - name: inference-parser
            - name: a2a-parser

# --- nginx TLS-terminator config ----------------------------------------
- apiVersion: v1
  kind: ConfigMap
  metadata:
    name: cortex-tls-front
    namespace: cortex-${USERNAME}
    labels:
      app: cortex
      cortex-user: ${USERNAME}
  data:
    nginx.conf: |
      daemon off;
      worker_processes 1;
      error_log /dev/stderr info;
      pid /tmp/nginx.pid;
      events { worker_connections 256; }
      stream {
        server {
          listen ${FORWARD_PROXY_PORT} ssl;
          ssl_certificate /cert/tls.crt;
          ssl_certificate_key /cert/tls.key;
          proxy_pass 127.0.0.1:${ENGINE_PORT};
        }
      }

# --- the instance pod: engine + agentop + tls-front ---------------------
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: cortex
    namespace: cortex-${USERNAME}
    labels:
      app: cortex
      cortex-user: ${USERNAME}
  spec:
    replicas: 1
    selector:
      matchLabels:
        app: cortex
    template:
      metadata:
        labels:
          app: cortex
          cortex-user: ${USERNAME}
      spec:
        containers:
          # The traffic engine: plaintext, localhost-only; the tls-front
          # sidecar is its sole ingress.
          - name: cortex
            image: ${IMAGE}
            command: ["/cortex"]
            args: ["--config", "/etc/cortex/cortex.yaml"]
            volumeMounts:
              - name: config
                mountPath: /etc/cortex
                readOnly: true
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: "2"
                memory: 1Gi
          # The interactive observer: traffic-viewer TUI inside a detached
          # tmux session, with bash as a supervising PID 1. tmux keeps
          # screen state server-side, so every attach (console via
          # `tmux attach -t agentop`, oc exec, reconnect) gets a full
          # repaint, and closing the terminal kills nothing. window-size
          # manual lets clients resize the session via
          # `tmux resize-window` (channel-4 resize is not applied on the
          # WebSocket exec path on this cluster). tty+stdin give the
          # exec'd tmux client a PTY.
          - name: agentop
            image: ${IMAGE}
            command: ["/bin/bash", "-c"]
            args:
              - >-
                tmux new -d -s agentop /agentop observe
                --endpoint http://127.0.0.1:${SESSION_API_PORT};
                tmux set-option -t agentop -w window-size manual;
                while tmux has-session -t agentop 2>/dev/null; do sleep 30; done
            env:
              - name: TERM
                value: xterm-256color
            tty: true
            stdin: true
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: "1"
                memory: 256Mi
          # TLS front: terminates with the cluster wildcard cert (secret
          # cortex-tls) and tunnels to the engine.
          - name: tls-front
            image: ${TLS_FRONT_IMAGE}
            command: ["nginx", "-c", "/etc/tls-front/nginx.conf"]
            ports:
              - containerPort: 13000
                name: forward-proxy
                protocol: TCP
            volumeMounts:
              - name: tls
                mountPath: /cert
                readOnly: true
              - name: tls-front-conf
                mountPath: /etc/tls-front
                readOnly: true
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 500m
                memory: 128Mi
        volumes:
          - name: config
            configMap:
              name: cortex-config
          - name: tls-front-conf
            configMap:
              name: cortex-tls-front
          - name: tls
            secret:
              secretName: cortex-tls

# --- service: route -> TLS front ----------------------------------------
- apiVersion: v1
  kind: Service
  metadata:
    name: cortex
    namespace: cortex-${USERNAME}
    labels:
      app: cortex
  spec:
    selector:
      app: cortex
    ports:
      - name: forward-proxy
        port: ${FORWARD_PROXY_PORT}
        targetPort: forward-proxy

# --- external route: per-user hostname, passthrough ---------------------
- apiVersion: route.openshift.io/v1
  kind: Route
  metadata:
    name: cortex
    namespace: cortex-${USERNAME}
    labels:
      app: cortex
  spec:
    # Passthrough: the router peeks SNI (which names the PROXY, so it
    # routes correctly, unlike the Host header of proxy requests) and
    # tunnels TLS to tls-front, which presents the cluster wildcard cert.
    host: cortex-${USERNAME}.${CLUSTER_APPS_DOMAIN}
    to:
      kind: Service
      name: cortex
      weight: 100
    port:
      targetPort: forward-proxy
    tls:
      termination: passthrough
