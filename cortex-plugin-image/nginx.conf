# The console requires plugin assets to be served over HTTPS using an
# OpenShift service serving certificate. The certificate is generated by
# the service-ca operator when the Service carries the
# service.beta.openshift.io/serving-cert-secret-name annotation, and is
# mounted into the pod as a Secret at /etc/nginx/certs.
server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;

    root /usr/share/nginx/html;
    index plugin-manifest.json;

    add_header Access-Control-Allow-Origin *;
    add_header Access-Control-Allow-Methods 'GET, OPTIONS';
    add_header Access-Control-Allow-Headers 'Origin, Content-Type, Accept';

    if ($request_method = OPTIONS) {
        return 204;
    }
}
